name: Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version tag (e.g., v1.25.3)
                required: true
    push:
        tags:
            - v*

jobs:
    release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            -   uses: actions/checkout@v4

            -   name: Validate release tag
                id: release_tag
                env:
                    EVENT_NAME: ${{ github.event_name }}
                    DISPATCH_VERSION: ${{ github.event.inputs.version }}
                    PUSH_REF_NAME: ${{ github.ref_name }}
                run: |
                    if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                        REQUESTED_TAG="$DISPATCH_VERSION"
                    else
                        REQUESTED_TAG="$PUSH_REF_NAME"
                    fi

                    VERSION_NAME=$(grep 'versionName' build.gradle.kts | sed "s/.*\"\\(.*\\)\".*/\\1/")
                    EXPECTED_TAG="v${VERSION_NAME}"
                    if [ "$REQUESTED_TAG" != "$EXPECTED_TAG" ]; then
                        echo "Release tag mismatch: requested '$REQUESTED_TAG', expected '$EXPECTED_TAG' from build.gradle.kts" >&2
                        exit 1
                    fi

                    echo "tag=$REQUESTED_TAG" >> "$GITHUB_OUTPUT"
                    echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                    echo "Validated release tag: $REQUESTED_TAG"

            -   name: Set up Java 17
                uses: actions/setup-java@v5
                with:
                    distribution: temurin
                    java-version: 17

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3
                with:
                    cache-read-only: true

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;$NDK_VERSION" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Decode keystore
                env:
                    KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                run: |
                    echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

            -   name: Create keystore.properties
                env:
                    KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
                    KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
                    KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
                run: |
                    echo "storeFile=release.keystore" > keystore.properties
                    echo "storePassword=$KEYSTORE_PASSWORD" >> keystore.properties
                    echo "keyAlias=$KEY_ALIAS" >> keystore.properties
                    echo "keyPassword=$KEY_PASSWORD" >> keystore.properties

            -   name: Build release APK
                run: ./gradlew assembleRelease

            -   name: Create Release
                uses: softprops/action-gh-release@v2
                with:
                    name: ${{ steps.release_tag.outputs.tag }}
                    tag_name: ${{ steps.release_tag.outputs.tag }}
                    target_commitish: ${{ steps.release_tag.outputs.commit }}
                    generate_release_notes: true
                    files: build/outputs/apk/release/*.apk
