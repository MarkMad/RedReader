name: Create Release

on:
    workflow_dispatch:
        inputs:
            version:
                description: Version tag (e.g., v1.25.3)
                required: true
    push:
        tags:
            - v*

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            -   name: Set up Java 17
                uses: actions/setup-java@v4
                with:
                    distribution: temurin
                    java-version: 17

            -   name: Set up Gradle
                uses: gradle/actions/setup-gradle@v3
                with:
                    cache-read-only: true

            -   name: Install NDK
                run: |
                    SDKMANAGER="${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"
                    NDK_VERSION="$(yq .versions.ndk gradle/libs.versions.toml)"
                    echo "Installing NDK ${NDK_VERSION}"
                    echo "y" | "$SDKMANAGER" "ndk;$NDK_VERSION" --sdk_root="${ANDROID_SDK_ROOT}"

            -   name: Decode keystore
                env:
                    KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
                run: |
                    echo "$KEYSTORE_BASE64" | base64 -d > release.keystore

            -   name: Create keystore.properties
                run: |
                    cat > keystore.properties <<EOF
                    storeFile=release.keystore
                    storePassword=${{ secrets.KEYSTORE_PASSWORD }}
                    keyAlias=${{ secrets.KEY_ALIAS }}
                    keyPassword=${{ secrets.KEY_PASSWORD }}
                    EOF

            -   name: Build release APK
                run: ./gradlew assembleRelease

            -   name: Get version name
                id: version
                run: |
                    VERSION_NAME=$(grep 'versionName' build.gradle.kts | sed "s/.*\"\\(.*\\)\".*/\\1/")
                    echo "version=$VERSION_NAME" >> $GITHUB_OUTPUT

            -   name: Create Release
                uses: softprops/action-gh-release@v2
                with:
                    name: v${{ steps.version.outputs.version }}
                    tag_name: v${{ steps.version.outputs.version }}
                    generate_release_notes: true
                    files: build/outputs/apk/release/*.apk
